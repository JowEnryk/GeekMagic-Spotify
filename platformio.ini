[platformio]
default_envs = ultra

[env:ultra]
platform = espressif8266
board = esp12e
framework = arduino

; El loader de SmallTV-Ultra deja el dispositivo con layout 4M/1M.
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

monitor_speed = 115200

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ARDUINOJSON_USE_DOUBLE=0
    -D USER_SETUP_LOADED
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT7
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_SCLK=14
    -D TFT_MOSI=13
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_BL=5
    -D TOUCH_CS=-1
    -D TFT_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder
    tzapu/WiFiManager @ ^2.0.17
